  <script src="../assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Seamless symmetric cycle (t=0 state === t=6 state)
      tl.fromTo(
        "#loop-card",
        { y: 0, scale: 1.0 },
        { y: -14, scale: 1.018, duration: 3.0, ease: "sine.inOut" },
        0
      ).to(
        "#loop-card",
        { y: 0, scale: 1.0, duration: 3.0, ease: "sine.inOut", immediateRender: false },
        3.0
      );

      tl.fromTo(
        "#loop-orb",
        { scale: 1.0, opacity: 0.22 },
        { scale: 1.24, opacity: 0.48, duration: 3.0, ease: "sine.inOut" },
        0
      ).to(
        "#loop-orb",
        { scale: 1.0, opacity: 0.22, duration: 3.0, ease: "sine.inOut", immediateRender: false },
        3.0
      );

      tl.fromTo(
        "#loop-sweep",
        { x: -180, opacity: 0 },
        { x: 1520, opacity: 0.85, duration: 2.0, ease: "power2.inOut" },
        1.0
      ).to(
        "#loop-sweep",
        { opacity: 0, duration: 0.5, immediateRender: false },
        3.0
      );

      window.__timelines["loop-main"] = tl;
    })();
  </script>
